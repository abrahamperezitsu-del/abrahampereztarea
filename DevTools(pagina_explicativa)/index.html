<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Avanzada: Chrome DevTools</title>
    <!-- Vinculamos el módulo de estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>🛠️ Domina Chrome Developer Tools</h1>
        <p>Guía técnica detallada para desarrolladores</p>
    </header>

    <div class="app-container">
        <!-- El menú lateral -->
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content" id="main-content"></main>

    <!-- Vinculamos los módulos de JavaScript -->

    <script src="data.js"></script>
    <script src="app.js"></script>
